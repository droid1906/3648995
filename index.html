<title>Wok Week</title>

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: phone-first app shell — sticky header, one scrolling view, fixed bottom tab bar. Celadon paper, ink text, chili accent. */
:root{
  --bg:#eaf0ec; --surface:#ffffff; --sunk:#dde6e0; --ink:#16212a; --muted:#5a6a6c; --line:#cfd9d3;
  --accent:#c8361d; --accent-ink:#ffffff; --leaf:#2d6a4c; --leaf-soft:#d3e8dc;
  --display:"Dela Gothic One", "Arial Black", system-ui, sans-serif;
  --body:"Zen Kaku Gothic New", "Hiragino Sans", system-ui, -apple-system, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10171a; --surface:#182126; --sunk:#0c1214; --ink:#e6ece9; --muted:#93a29f; --line:#28353a;
  --accent:#ff6b4e; --accent-ink:#1a0a06; --leaf:#74c49b; --leaf-soft:#1e3a2d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10171a; --surface:#182126; --sunk:#0c1214; --ink:#e6ece9; --muted:#93a29f; --line:#28353a;
  --accent:#ff6b4e; --accent-ink:#1a0a06; --leaf:#74c49b; --leaf-soft:#1e3a2d; color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
*{-webkit-tap-highlight-color:transparent}
button{touch-action:manipulation}
input,textarea,select{font-size:16px!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px}
.brand{font-family:var(--display);font-size:22px;letter-spacing:.01em;line-height:1}
.brand span{color:var(--accent)}
.sync{font-family:var(--mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
main{padding-block:16px calc(96px + env(safe-area-inset-bottom,0px))}
main,.scrim{overscroll-behavior:contain}
h2{font-family:var(--display);font-size:20px;font-weight:400;margin:0;text-wrap:balance}
.lede{color:var(--muted);margin:4px 0 0;font-size:14px}
.section{display:flex;flex-direction:column;gap:14px}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;display:flex;gap:6px;align-items:baseline}
.stat b{font-family:var(--mono);font-weight:500;font-variant-numeric:tabular-nums}
.note{background:var(--leaf-soft);color:var(--ink);border-radius:var(--r);padding:10px 14px;font-size:13px}
/* week */
.days{display:flex;flex-direction:column;gap:10px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;grid-template-columns:48px 1fr;gap:10px;align-items:start}
.day.today{border-color:var(--accent)}
.dname{font-family:var(--display);font-size:15px;line-height:1.2;padding-top:6px}
.dname small{display:block;font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.06em}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:8px;min-width:0}
.slot{min-width:0;text-align:left;background:var(--sunk);border:1px dashed var(--line);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:2px;min-height:58px}
.slot .lbl{font-family:var(--mono);font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.slot .meal{font-weight:700;font-size:14px;line-height:1.25;overflow-wrap:anywhere}
.slot.filled{background:var(--surface);border-style:solid}
.slot.left .meal{color:var(--leaf)}
.slot.empty .meal{color:var(--muted);font-weight:500}
/* buttons */
.btn{border:0;border-radius:999px;padding:10px 16px;font-weight:700;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.small{padding:6px 12px;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
/* chips */
.search{width:100%;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:10px 16px;-webkit-appearance:none;appearance:none}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
/* recipe list */
.rlist{display:flex;flex-direction:column;gap:8px}
.rcard{text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px 10px 10px;display:grid;grid-template-columns:68px 1fr auto;gap:12px;align-items:center}
.rbody{display:flex;flex-direction:column;gap:3px;min-width:0}
.thumb{display:block;aspect-ratio:4/3;max-width:100%;border-radius:10px;overflow:hidden;background:var(--sunk)}
.thumb svg,.thumb img{display:block;width:100%;height:100%;object-fit:cover}
.hero{border-radius:16px;overflow:hidden;background:var(--sunk);aspect-ratio:4/3;max-height:260px;width:100%;max-width:100%;display:flex;align-items:center;justify-content:center}
.hero svg{width:82%;height:auto}
.hero img{width:100%;height:100%;object-fit:cover}
.facts{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 4px;text-align:center;min-width:0}
.fact b{display:block;font-family:var(--mono);font-weight:500;font-size:14px;font-variant-numeric:tabular-nums}
.fact span{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag.veg{color:var(--leaf);border-color:var(--leaf)}
.minis{display:flex;gap:3px;margin-top:4px}
.mini{width:30px;flex:none}
.slot .cost{font-family:var(--mono);font-size:10px;color:var(--muted)}
.pick{align-items:center}
.pick .pname{flex:1;min-width:0}
.pick .pthumb{width:44px;flex:none}
.pick.on{border-color:var(--leaf);background:var(--leaf-soft)}
.pick.on .pname::before{content:"✓ ";color:var(--leaf);font-weight:700}
.ghead{margin:4px 0 0;font-family:var(--mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:500}
.combo-bar{flex:none;background:var(--surface);border-top:1px solid var(--line);padding:12px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;gap:12px;align-items:center;justify-content:space-between}
.combo-bar .what{min-width:0;font-weight:700;font-size:14px;overflow-wrap:anywhere}
.photo-btn{position:relative;overflow:hidden}
.photo-btn input{position:absolute;inset:0;opacity:0;cursor:pointer}
@media (max-width:340px){.facts{grid-template-columns:repeat(3,1fr)}}
@media (max-width:390px){.fact span{font-size:9px;letter-spacing:.03em}}
.rcard h3{margin:0;font-size:16px;line-height:1.3;min-width:0}
.meta{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.price{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:15px;grid-row:span 2}
/* lists */
.group h4{margin:6px 0;font-family:var(--mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:500}
.items{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.items li{display:flex;align-items:center;gap:10px;padding:8px 4px 8px 12px;min-height:48px;border-top:1px solid var(--line)}
.items li:first-child{border-top:0}
.items label{flex:1;display:flex;gap:10px;align-items:center;min-width:0;cursor:pointer}
.items input[type=checkbox]{width:22px;height:22px;accent-color:var(--leaf);flex:none}
.items .txt{min-width:0;overflow-wrap:anywhere}
.items .sub{font-family:var(--mono);font-size:11px;color:var(--muted)}
.items li.done .txt{text-decoration:line-through;color:var(--muted)}
.x{border:0;background:none;color:var(--muted);font-size:22px;line-height:1;min-width:44px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;margin:-8px -10px -8px 0;flex:none}
.add{display:flex;gap:8px}
.add input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 14px}
.empty-state{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:20px;text-align:center;color:var(--muted)}
/* tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
/* stores */
.scard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.scard.fav{border-color:var(--leaf)}
.shead{display:flex;justify-content:space-between;gap:10px;align-items:start}
.shead h3{margin:0;font-size:16px;line-height:1.3}
.star{border:0;background:none;font-size:22px;line-height:1;color:var(--muted);min-width:44px;min-height:44px;margin:-10px -10px 0 0;flex:none}
.star[aria-pressed="true"]{color:var(--leaf)}
.tag{display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);border-radius:999px;padding:1px 8px;color:var(--muted)}
.tag.asian{color:var(--accent);border-color:var(--accent)}
.cover{display:flex;align-items:center;gap:10px;font-size:13px}
.bar{flex:1;height:6px;background:var(--sunk);border-radius:999px;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--leaf);border-radius:999px}
.cover b{font-family:var(--mono);font-weight:500;font-variant-numeric:tabular-nums}
.scard p{margin:0;font-size:13px;color:var(--muted)}
.link{color:var(--accent);font-weight:700;text-decoration:none;font-size:13px}
.where{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;display:flex;justify-content:space-between;gap:10px;align-items:center;text-align:left;width:100%;font-size:13px}
.where b{font-weight:700}
nav.tabs button{border:0;background:none;padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--muted);font-weight:500}
nav.tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--accent)}
nav.tabs .badge{font-family:var(--mono);font-size:10px}
/* sheet */
.scrim{position:fixed;inset:0;background:rgb(0 0 0 / .45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet-wrap{width:100%;max-width:640px;max-height:calc(100% - env(safe-area-inset-top,0px) - 24px);display:flex;flex-direction:column;border-radius:20px 20px 0 0;overflow:hidden;background:var(--bg)}
.sheet{background:var(--bg);width:100%;flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding-block:18px calc(24px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.sheet-head{display:flex;justify-content:space-between;gap:12px;align-items:start}
.sheet>*{flex-shrink:0}
.sheet ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px}
.ing{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.ing li{display:flex;justify-content:space-between;gap:12px;border-bottom:1px dotted var(--line);padding:4px 0}
.ing .q{font-family:var(--mono);font-size:12px;color:var(--muted);text-align:right;flex:none}
.have{color:var(--leaf);font-weight:700}
.picks{display:flex;flex-direction:column;gap:6px}
.pick{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;display:flex;justify-content:space-between;gap:10px}
.pick.special{background:var(--sunk)}
form.f{display:flex;flex-direction:column;gap:10px}
form.f label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
form.f input,form.f textarea,form.f select{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;color:var(--ink)}
form.f .two{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
@media (max-width:340px){.slots{grid-template-columns:1fr}}
@media (max-width:390px){.day{grid-template-columns:40px 1fr;gap:8px;padding:10px}.dname{font-size:14px}.slot{padding:7px 8px}.slot .meal{font-size:13px}.mini{width:26px}.facts{gap:4px}.fact b{font-size:13px}}
@media (prefers-reduced-motion:no-preference){.sheet-wrap{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}

 the noodles and rinse cold.","Fry tofu until crisp.","Mix soy, lime, sugar and 2 tbsp water as dressing.","Pile noodles, veg and tofu in a bowl, pour over dressing, top with peanuts."]},{"id":"lemongrass-chicken","name":"Lemongrass chicken","cu":"Vietnam","min":30,"cost":2.0,"ing":["2|chicken thighs|f","1 stalk|lemongrass|v","2 cloves|garlic|v","1 tbsp|fish sauce|s","1 tsp|sugar|s","1 cup, raw|rice|d","½|cucumber|v"],"steps":["Finely chop lemongrass and garlic, mix with fish sauce and sugar.","Marinate the chicken 15 minutes.","Pan-fry until caramelised. Serve with rice and cucumber."]},{"id":"nasi-goreng","name":"Nasi goreng","cu":"Indonesia","min":15,"cost":1.1,"ing":["1 cup, cooked|rice|d","1|eggs|f","1 tbsp|kecap manis|s","2 cloves|garlic|v","½|onion|v","1 pinch|chili flakes|s","½|cucumber|v"],"steps":["Fry onion, garlic and chili.","Add day-old rice and kecap manis, fry until dark and sticky.","Top with a fried egg and cucumber slices."]},{"id":"mie-goreng","name":"Mie goreng","cu":"Indonesia","min":20,"cost":1.3,"ing":["1 portion|noodles|d","1|eggs|f","¼|cabbage|v","1 tbsp|kecap manis|s","2 cloves|garlic|v","1 pinch|chili flakes|s"],"steps":["Cook and drain the noodles.","Fry garlic and chili, scramble the egg.","Add cabbage, noodles and kecap manis, toss until glossy."]},{"id":"chicken-satay","name":"Chicken satay & peanut sauce","cu":"Malaysia","min":30,"cost":2.1,"ing":["2|chicken thighs|f","2 tbsp|peanut butter|s","3 tbsp|coconut milk|d","1 tbsp|soy sauce|s","1 tsp|curry powder|s","½|lime|v","1 cup, raw|rice|d","½|cucumber|v"],"steps":["Marinate chicken strips in curry powder, soy and a spoon of coconut milk.","Pan-fry or grill until charred.","Heat peanut butter, coconut milk, lime and water into a sauce.","Serve with rice and cucumber."]},{"id":"gado-gado","name":"Gado-gado","cu":"Indonesia","min":25,"cost":1.5,"ing":["1|potatoes|v","1|eggs|f","1 handful|green beans|v","¼|cabbage|v","100 g|firm tofu|f","2 tbsp|peanut butter|s","½|lime|v","1 tsp|soy sauce|s"],"steps":["Boil potato chunks, add the egg and beans for the last 8 minutes.","Fry the tofu.","Whisk peanut butter, lime, soy and hot water into a sauce.","Arrange veg, egg and tofu, pour over the sauce."]},{"id":"laksa","name":"Curry laksa","cu":"Malaysia","min":25,"cost":2.2,"ing":["100 g|rice noodles|d","½ tin|coconut milk|d","1 tbsp|laksa paste|s","1|chicken thighs|f","1 handful|bean sprouts|v","1|eggs|f","½|lime|v"],"steps":["Fry laksa paste 1 minute, add coconut milk and 300 ml water.","Simmer sliced chicken in it 8 minutes.","Pour over soaked noodles, top with egg, sprouts and lime."]},{"id":"kari-ayam","name":"Malaysian chicken curry","cu":"Malaysia","min":40,"cost":1.9,"ing":["2|chicken thighs|f","1|potatoes|v","2 tbsp|curry powder|s","½ tin|coconut milk|d","1|onion|v","2 cloves|garlic|v","1 cup, raw|rice|d"],"steps":["Fry onion and garlic, add curry powder mixed with water to a paste.","Add chicken and potato, coat well.","Add coconut milk and 150 ml water, simmer 25 minutes."]},{"id":"tempe-manis","name":"Sweet soy tempeh","cu":"Indonesia","min":20,"cost":1.7,"ing":["200 g|tempeh|f","2 tbsp|kecap manis|s","2 cloves|garlic|v","1 pinch|chili flakes|s","1 handful|peanuts|d","1 cup, raw|rice|d"],"steps":["Start the rice. Cut tempeh into thin sticks and fry until crisp.","Fry garlic and chili, add kecap manis and a splash of water.","Toss tempeh and peanuts in the glaze."]},{"id":"chicken-adobo","name":"Chicken adobo","cu":"Philippines","min":45,"cost":1.8,"ing":["2|chicken thighs|f","3 tbsp|soy sauce|s","3 tbsp|rice vinegar|s","4 cloves|garlic|v","2|bay leaves|s","1 tsp|black pepper|s","1 cup, raw|rice|d"],"steps":["Put everything except the rice in a pan with 100 ml water.","Simmer covered 30 minutes.","Uncover, reduce the sauce until glossy and brown the chicken in it."]},{"id":"pancit-canton","name":"Pancit canton","cu":"Philippines","min":25,"cost":1.6,"ing":["1 portion|noodles|d","1|chicken thighs|f","¼|cabbage|v","1|carrot|v","1 handful|green beans|v","1 tbsp|soy sauce|s","1 tbsp|oyster sauce|s","2 cloves|garlic|v"],"steps":["Fry sliced chicken and garlic.","Add carrot, beans and cabbage, then 100 ml water.","Add noodles, soy and oyster sauce, toss until the liquid is absorbed."]},{"id":"tortang-talong","name":"Aubergine omelette","cu":"Philippines","min":20,"cost":0.9,"ing":["1|aubergine|v","2|eggs|f","1 clove|garlic|v","1 cup, raw|rice|d"],"steps":["Char the whole aubergine in a dry pan or under the grill until soft, peel.","Flatten it with a fork, dip in beaten egg with garlic and salt.","Fry 3 minutes per side."]},{"id":"ginisang-monggo","name":"Mung bean stew","cu":"Philippines","min":40,"cost":0.8,"ing":["½ cup|mung beans|d","1|onion|v","2 cloves|garlic|v","½ tin|chopped tomatoes|d","1 handful|spinach|v","1 tbsp|soy sauce|s"],"steps":["Simmer mung beans in 700 ml water 30 minutes until soft.","Fry onion, garlic and tomato, stir into the beans.","Add spinach and soy sauce for 2 minutes."]},{"id":"garlic-green-beans","name":"Garlic green beans","cu":"China","min":10,"cost":0.6,"ing":["1 handful|green beans|v","2 cloves|garlic|v","1 tsp|soy sauce|s","1 pinch|chili flakes|s"],"steps":["Fry beans in a hot pan until blistered, 5 minutes.","Add garlic and chili for 30 seconds.","Splash with soy sauce."],"side":true},{"id":"egg-drop-soup","name":"Egg drop soup","cu":"China","min":10,"cost":0.4,"ing":["1|eggs|f","1 tsp|cornstarch|s","1|stock cube|s","1 tsp|soy sauce|s","1|spring onions|v"],"steps":["Bring 400 ml water to a simmer with the stock cube and soy sauce.","Thicken lightly with cornstarch.","Stir the soup in a circle and pour in the beaten egg slowly.","Top with spring onions."],"side":true},{"id":"steamed-egg","name":"Chinese steamed egg","cu":"China","min":15,"cost":0.4,"ing":["2|eggs|f","1 tsp|soy sauce|s","½ tsp|sesame oil|s","1|spring onions|v"],"steps":["Beat eggs with 1.5× their volume of warm water and a pinch of salt.","Strain into a bowl, cover with a plate.","Steam on low 10 minutes until just set.","Drizzle with soy and sesame oil."],"side":true},{"id":"tamagoyaki","name":"Tamagoyaki","cu":"Japan","min":10,"cost":0.5,"ing":["2|eggs|f","1 tsp|sugar|s","1 tsp|soy sauce|s"],"steps":["Beat eggs with sugar and soy.","Pour a thin layer into an oiled pan, roll it up when nearly set.","Add another layer under the roll, repeat.","Slice."],"side":true},{"id":"hiyayakko","name":"Cold tofu with soy","cu":"Japan","min":3,"cost":0.6,"ing":["150 g|soft tofu|f","1 tsp|soy sauce|s","1|spring onions|v","1 thumb|ginger|v"],"steps":["Drain the tofu and put it on a plate.","Top with grated ginger and spring onions.","Pour over soy sauce."],"side":true},{"id":"wakame-salad","name":"Wakame cucumber salad","cu":"Japan","min":5,"cost":0.6,"ing":["1 pinch|dried wakame|d","½|cucumber|v","1 tbsp|rice vinegar|s","1 tsp|sesame oil|s","1 tsp|sugar|s"],"steps":["Soak wakame 5 minutes and squeeze dry.","Slice cucumber thinly and salt it 5 minutes.","Toss with vinegar, sugar and sesame oil."],"side":true},{"id":"goma-ae","name":"Sesame spinach","cu":"Japan","min":8,"cost":0.5,"ing":["200 g|spinach|v","1 tbsp|sesame seeds|s","1 tsp|soy sauce|s","1 tsp|sugar|s"],"steps":["Blanch spinach 30 seconds, cool and squeeze dry.","Toast and crush sesame seeds, mix with soy and sugar.","Toss with the spinach."],"side":true},{"id":"quick-kimchi","name":"Quick cabbage kimchi","cu":"Korea","min":20,"cost":0.3,"ing":["¼|cabbage|v","1 tbsp|chili flakes|s","2 cloves|garlic|v","1 thumb|ginger|v","1 tsp|sugar|s"],"steps":["Chop cabbage, salt it well and leave 1 hour, rinse and squeeze.","Mix with chili, garlic, ginger and sugar.","Pack in a jar; it's good now and better after 2 days."],"side":true},{"id":"gyeran-mari","name":"Korean rolled omelette","cu":"Korea","min":10,"cost":0.5,"ing":["2|eggs|f","½|carrot|v","1|spring onions|v"],"steps":["Beat eggs with finely chopped carrot, spring onion and salt.","Pour into a pan, roll up as it sets, adding more egg.","Slice."],"side":true},{"id":"kongnamul","name":"Bean sprout salad","cu":"Korea","min":8,"cost":0.4,"ing":["2 handfuls|bean sprouts|v","1 tsp|sesame oil|s","1 clove|garlic|v","1|spring onions|v"],"steps":["Boil sprouts 3 minutes with the lid on, drain.","Toss with sesame oil, garlic, spring onion and salt."],"side":true},{"id":"gamja-jorim","name":"Soy-glazed potatoes","cu":"Korea","min":25,"cost":0.4,"ing":["2|potatoes|v","2 tbsp|soy sauce|s","1 tbsp|honey|s","1 clove|garlic|v","1 tsp|sesame seeds|s"],"steps":["Fry small potato cubes until golden.","Add soy, honey, garlic and 80 ml water.","Simmer until glossy and tender, sprinkle sesame."],"side":true},{"id":"raita","name":"Cucumber raita","cu":"India","min":5,"cost":0.4,"ing":["3 tbsp|yogurt|f","½|cucumber|v","1 pinch|cumin seeds|s"],"steps":["Grate the cucumber and squeeze out the water.","Mix with yogurt, toasted cumin and salt."],"side":true},{"id":"chapati","name":"Chapati","cu":"India","min":25,"cost":0.15,"ing":["½ cup|flour|d","1 tsp|vegetable oil|s"],"steps":["Mix flour, oil, salt and warm water into a soft dough, rest 15 minutes.","Roll thin circles.","Cook in a dry hot pan 1 minute per side until puffed."],"side":true},{"id":"jeera-rice","name":"Jeera rice","cu":"India","min":20,"cost":0.25,"ing":["½ cup|rice|d","1 tsp|cumin seeds|s","1 tsp|butter|f"],"steps":["Fry cumin seeds in butter until fragrant.","Add rinsed rice and 1.2× water.","Cover and cook on low 12 minutes, rest 10."],"side":true},{"id":"thai-cucumber-salad","name":"Thai cucumber salad","cu":"Thailand","min":5,"cost":0.4,"ing":["½|cucumber|v","¼|onion|v","1 tbsp|rice vinegar|s","1 tsp|sugar|s","1 pinch|chili flakes|s"],"steps":["Dissolve sugar in vinegar with a pinch of salt.","Add sliced cucumber, onion and chili."],"side":true},{"id":"garlic-bok-choy","name":"Garlic bok choy","cu":"China","min":8,"cost":0.8,"ing":["2|bok choy|v","2 cloves|garlic|v","1 tsp|soy sauce|s"],"steps":["Halve the bok choy.","Fry garlic 30 seconds, add bok choy and a splash of water.","Cover 2 minutes, finish     s+=`<path d="M${60-RX+6} ${cy+10*k} Q${60-RX+12} ${cy+38*k} 60 ${cy+40*k}" fill="none" stroke="#fff" stroke-width="2" opacity=".18"/>`;
    s+=`<ellipse cx="60" cy="${cy}" rx="${RX}" ry="${RY}" fill="${w2}"/><ellipse cx="60" cy="${cy}" rx="${RX-3}" ry="${RY-2.5}" fill="${a.b}"/>`;
    if(a.t==="bowl"){ s+=`<ellipse cx="60" cy="${cy-3}" rx="${RX-9}" ry="${RY-3}" fill="${a.b}"/><ellipse cx="60" cy="${cy-3}" rx="${RX-9}" ry="${RY-3}" fill="#fff" opacity=".08"/>`; cy-=3; }

function save(){

async function flush(){
  if(saving){saveTimer=setTimeout(flush,400);return;}
  if(mode==="db"&&ref){
    saving=true; setSync("Saving…");
    const snap=JSON.parse(JSON.stringify(S)); dirty=false;
    try{await ref.set(snap); setSync("Saved");}
    catch(e){ if(e&&e.code==="unavailable"){setTimeout(()=>{dirty=true;flush();},1500+Math.random()*1000);} else setSync("Not saved"); }
    saving=false;
  } else {
    try{localStorage.setItem(LS,JSON.stringify(S)); setSync("Saved on this device");}catch(e){setSync("Not saved");}
    dirty=false;
  }
}

async function connect(){
  if(!window.claude||!window.claude.use){setSync("Saved on this device");return;}
  try{
    const [d,u]=await Promise.all([claude.use("db"),claude.use("user")]);
    const id=u?await u.id():null;
    claude.use("assets").then(a=>{assetsApi=a;}).catch(()=>{});
    if(!d||!id){setSync("Saved on this device");return;}
    db=d; ref=db.doc("data/users/"+id+"/state"); mode="db"; setSync("Syncing…");
    const t=setTimeout(()=>setSync("Offline"),10000);
    ref.onSnapshot(snap=>{
      if(!snap.metadata.fromCache){clearTimeout(t); if(!saving&&!dirty) setSync("Synced");}
      if(dirty||saving||snap.metadata.hasPendingWrites) return;
      if(snap.exists){const v=snap.data(); S=fix(JSON.parse(JSON.stringify(v))); render();}
    },err=>{clearTimeout(t); setSync("Offline");});
  }catch(e){setSync("Saved on this device");}
}

function slotLabel(v){
  const m=mealOf(v);
  if(!m.length) return {t:"Tap to plan",c:"empty",rs:[]};
  if(m[0]==="@left") return {t:"Leftovers",c:"filled left",rs:[]};
  if(m[0]==="@out") return {t:"Out / skip",c:"filled",rs:[]};
  const rs=m.map(R).filter(Boolean); if(!rs.length) return {t:"Tap to plan",c:"empty",rs:[]};
  const cost=rs.reduce((a,r)=>a+r.cost,0), kcal=rs.reduce((a,r)=>a+(meta(r).kcal||0),0);
  return {t:rs.map(r=>meta(r).short||r.name).join(" + "),c:"filled",rs,sub:eur(cost)+(kcal?" · "+kcal+" kcal":"")};
}
function renderWeek(){
  const vals=Object.values(S.plan).map(mealOf).filter(m=>m.length);
  const flat=vals.flat(), planned=vals.length, cooked=flat.filter(id=>R(id)&&!R(id).side).length;
  const cost=flat.reduce((a,id)=>a+(R(id)?R(id).cost:0),0)+flat.filter(v=>v==="@left").length*0.9;
  const todayIdx=(new Date().getDay()+6)%7;
  view.innerHTML=`<div class="section">
    <div><h2>This week</h2><p class="lede">Lunch and dinner. Tap a meal to pick one dish or a combo.</p></div>

let query="";
function matchRecipe(r,q){if(!q) return true; q=norm(q); return norm(r.name).includes(q)||norm(r.cu).includes(q)||r.ing.some(i=>norm(parse(i).n).includes(q));}

/* ---------- sheets ---------- */
const root=document.getElementById("sheetRoot");
function sheet(html,bind,foot){
  root.innerHTML=`<div class="scrim" id="scrim"><div class="sheet-wrap" role="dialog" aria-modal="true"><div class="sheet"${foot?' style="padding-bottom:16px"':""}>${html}</div>${foot||""}</div></div>`;
  document.body.style.overflow="hidden";
  const s=document.getElementById("scrim");
  s.onclick=e=>{if(e.target===s) close();};
  root.querySelectorAll("[data-close]").forEach(b=>b.onclick=close);
  bind&&bind(root);
}
function close(){root.innerHTML=""; document.body.style.overflow="";}
document.addEventListener("keydown",e=>{if(e.key==="Escape") close();});

function openPicker(slot){
  const [d,sl]=slot.split("-"); const day=DAYS.find(x=>x[0]===d)[1];
  let sel=mealOf(S.plan[slot]).filter(id=>R(id));
  const all=recipes().slice().sort((a,b)=>a.cost-b.cost);
  const row=r=>`<button class="pick${sel.includes(r.id)?" on":""}" aria-pressed="${sel.includes(r.id)}" data-t="${esc(r.id)}" data-q="${esc(norm(r.name+" "+r.cu+" "+r.ing.map(i=>parse(i).n).join(" ")))}"><span class="pthumb thumb">${thumb(r)}</span><span class="pname">${esc(r.name)}</span><span class="meta">${eur(r.cost)}</span></button>`;
  sheet(`<div class="sheet-head"><div><h2>${day} ${sl==="l"?"lunch":"dinner"}</h2><p class="lede">Pick one dish, or several for a combo like miso soup + jammy egg + rice.</p></div><button class="x" data-close aria-label="Close">×</button></div>
    <input class="search" id="pq" type="search" placeholder="Search ${all.length} dishes" autocomplete="off">
    <h4 class="ghead">Sides</h4><div class="picks">${all.filter(r=>r.side).map(row).join("")}</div>
    <h4 class="ghead">Mains</h4><div class="picks">${all.filter(r=>!r.side).map(row).join("")}</div>
    <h4 class="ghead">Other</h4><div class="picks">
      <button class="pick special" data-sp="@left"><span class="pname">Leftovers</span><span class="meta">€0.90 avg</span></button>
      <button class="pick special" data-sp="@out"><span class="pname">Out / skip</span></button>
      <button class="pick special" data-sp=""><span class="pname">Clear this meal</span></button></div>`,el=>{
    const upd=()=>{const rs=sel.map(R).filter(Boolean), c=rs.reduce((a,r)=>a+r.cost,0), k=rs.reduce((a,r)=>a+(meta(r).kcal||0),0), p=rs.reduce((a,r)=>a+(meta(r).p||0),0);
      el.querySelector("#cbWhat").innerHTML=rs.length?`${esc(rs.map(r=>meta(r).short||r.name).join(" + "))}<div class="meta">${eur(c)} · ${k} kcal · ${p} g protein</div>`:`<span class="meta">Nothing picked yet</span>`;};
    const pq=el.querySelector("#pq"); pq.oninput=()=>{const q=norm(pq.value); el.querySelectorAll("[data-q]").forEach(b=>{b.hidden=!!q&&!b.dataset.q.includes(q);}); el.querySelectorAll(".picks").forEach(g=>{const h=g.previousElementSibling; const any=[...g.children].some(c=>!c.hidden); g.hidden=!any; if(h&&h.classList.contains("ghead")) h.hidden=!any;});};
    el.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{const id=b.dataset.t; sel=sel.includes(id)?sel.filter(x=>x!==id):sel.concat(id); const on=sel.includes(id); b.classList.toggle("on",on); b.setAttribute("aria-pressed",on); upd();});
    el.querySelectorAll("[data-sp]").forEach(b=>b.onclick=()=>{const v=b.dataset.sp; if(v) S.plan[slot]=[v]; else delete S.plan[slot]; save(); close(); render();});
    el.querySelector("#cbSave").onclick=()=>{if(sel.length) S.plan[slot]=sel.slice(); else delete S.plan[slot]; save(); close(); render();};
    upd();
  },`<div class="combo-bar"><div class="what" id="cbWhat"></div><button class="btn" id="cbSave">Save</button></div>`);
}

  });
}

    <form class="f" id="ns">
      <label>Name<input id="nsName" required placeholder="e.g. Fruteria on my street"></label>
      <label>Where<input id="nsArea" placeholder="Street or neighbourhood"></label>
      <label>Type<select id="nsKind"><option value="asian">Asian supermarket</option><option value="super">Supermarket</option><option value="market">Fresh market / greengrocer</option></select></label>
      <label>Notes<textarea id="nsNote" rows="3" placeholder="Opening hours, what's good there"></textarea></label>
      <button class="btn">Save shop</button>
    </form>`,el=>{
    el.querySelector("#ns").onsubmit=e=>{e.preventDefault();
      const name=el.querySelector("#nsName").value.trim(); if(!name) return;
      const st={id:"s-"+uid8(),custom:true,name,area:el.querySelector("#nsArea").value.trim()||"Barcelona",kind:el.querySelector("#nsKind").value,price:"",note:el.querySelector("#nsNote").value.trim()};
      S.stores=S.stores.concat(st); S.favs=S.favs.concat(st.id); save(); close(); render();};
  });
}

function go(t){tab=t; try{history.replaceState(null,"","#"+t);}catch(e){} window.scrollTo(0,0); render();}
document.querySelectorAll("nav.tabs button").forEach(b=>b.onclick=()=>go(b.dataset.tab));
window.addEventListener("hashchange",()=>{const h=location.hash.slice(1); if(["week","recipes","pantry","shop","stores"].includes(h)){tab=h;render();}});
render(); connect();
})();
</script>

</body></html>
